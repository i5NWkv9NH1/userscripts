name: Build Userscripts

on:
  push:
    branches: [master, main]
    paths:
      - "packages/**"
      - "sites/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, and test
        run: |
          bunx tsc --noEmit
          bunx biome check .
          bun test

      - name: Build userscripts with version timestamp
        env:
          SORA_VERSION_STAMP: "1"
        run: bun run build

      - name: Commit updated dist scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore(build): auto build userscripts [skip ci]"
            git push
          fi
